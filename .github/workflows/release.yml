name: 릴리스

# v* 태그를 올리면 Android APK와 Windows 설치 파일을 만들어 GitHub Releases에 올리고,
# 앱이 읽는 catalog/version.json을 그 버전으로 고쳐 main에 커밋한다(docs/SPEC.md 7.21, 7.22).
#
# 빌드 방법(Flutter 버전, 서버 주소 넣기, 서명)은 ci.yml과 같게 둔다. 한쪽을 고치면 다른 쪽도 고친다.
# 태그는 app/pubspec.yaml의 version과 같아야 한다(v0.1.0 ↔ 0.1.0+1). 다르면 처음 작업에서 멈춘다.
# 태그에 '-'가 들어 있으면(v0.2.0-beta.1) 시험판으로 올리고 version.json은 건드리지 않는다.
#
# 태그를 올릴 수 없으면 Actions 화면에서 이 작업을 손으로 돌린다(Run workflow, 브랜치는 main).
# 그때는 app/pubspec.yaml의 version으로 태그 이름을 정하고, 릴리스를 만들면서 태그도 함께 만든다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: '앱의 업데이트 안내에 보일 한 줄'
        required: false
        default: '새 버전입니다.'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 올리는 작업 둘만 따로 쓰기 권한을 받는다.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.0'
  # ci.yml과 같은 값이다. 앱에 그대로 들어가는 공개 값이고, 비밀값이 아니다.
  SERVER_DEFINES: >-
    --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://trygkkxqeqbtwxqmclyx.supabase.co' }}
    --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_I2hsFvk7-xz0B0oO2SKXlQ_aXvVwkZd' }}

jobs:
  prepare:
    name: 버전 확인
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      # 태그와 앱 안의 버전이 다르면 version.json의 latest와 앱이 아는 제 버전이 어긋나,
      # 방금 올린 앱이 계속 "새 버전이 있습니다"라고 알리게 된다. 빌드하기 전에 막는다.
      - id: version
        name: 태그와 pubspec.yaml의 버전 맞춰 보기
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # 손으로 돌렸다. main에서만 받고, 태그 이름은 앱의 버전에서 정한다.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error title=main에서 돌려야 한다::Run workflow에서 브랜치를 main으로 고른다. 받은 것: $GITHUB_REF"
              exit 1
            fi
            tag="v$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
              echo "::error title=이미 있는 버전이다::태그 $tag 가 이미 있다. app/pubspec.yaml의 version을 올려 커밋한 뒤 다시 돌린다."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=태그 이름이 버전 꼴이 아니다::v1.2.3 또는 v1.2.3-beta.1 꼴이어야 한다. 받은 태그: $tag"
            exit 1
          fi
          pubspec=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          if [ "$pubspec" != "$version" ]; then
            echo "::error title=태그와 앱의 버전이 다르다::태그는 $version, app/pubspec.yaml은 $pubspec 이다. pubspec.yaml의 version을 고쳐 커밋한 뒤 태그를 다시 올린다."
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "버전 $version (시험판: $prerelease)"

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # ci.yml의 같은 단계와 같다. 비밀값이 없어도 릴리스는 만들어지지만 디버그 키로 서명된다.
      # 디버그 키는 러너가 그때그때 만드는 것이라, 그렇게 올린 APK 위에는 다음 버전을 덮어 설치하지 못할 수 있다.
      - name: 서명 키 준비
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning title=디버그 키로 서명한 APK를 올린다::서명 키(ANDROID_KEYSTORE_BASE64)가 없다. 이 APK를 설치한 사람은 다음 버전을 덮어 설치하지 못하고 지웠다가 다시 깔아야 할 수 있다."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "저장소의 서명 키로 서명합니다."
      - run: flutter build apk --release --target-platform android-arm64 ${{ env.SERVER_DEFINES }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # 릴리스에 올릴 이름. catalog/version.json의 주소가 이 이름을 가리킨다.
      - run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/gagyebu-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/gagyebu-android-arm64.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows 설치 파일
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release ${{ env.SERVER_DEFINES }}
      # 앱이 스스로 띄우는 모델 서버(llama-server)를 빌드 폴더에 넣는다. 판과 해시는 스크립트에 있다.
      - name: 모델 서버 실행 파일 넣기
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./installer/fetch_engines.ps1
      # Flutter의 Windows 앱은 VC++ 런타임 DLL이 있어야 켜진다. 없는 PC에서도 돌게 실행 폴더에 함께 넣는다.
      # Visual Studio의 재배포 폴더에서 찾고, 없으면 러너의 System32에 있는 것을 쓴다.
      - name: VC++ 런타임을 실행 폴더에 넣기
        run: |
          $release = "build\windows\x64\runner\Release"
          $crt = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path -LiteralPath $vswhere) {
            $found = & $vswhere -latest -products * -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\msvcp140.dll" | Select-Object -Last 1
            if ($found -and (Test-Path -LiteralPath $found)) { $crt = Split-Path -Parent $found }
          }
          if (-not $crt) { $crt = Join-Path $env:SystemRoot "System32" }
          Write-Host "VC++ 런타임 폴더: $crt"
          foreach ($name in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item -LiteralPath (Join-Path $crt $name) -Destination $release -ErrorAction Stop
          }
      # 러너에 Inno Setup이 이미 있으면 그대로 쓰고, 없으면 깐다.
      - name: Inno Setup 준비
        run: |
          function Find-Iscc {
            $command = Get-Command "iscc.exe" -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if (-not $root) { continue }
              $folders = Get-ChildItem -LiteralPath $root -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending
              foreach ($folder in $folders) {
                $candidate = Join-Path $folder.FullName "ISCC.exe"
                if (Test-Path -LiteralPath $candidate) { return $candidate }
              }
            }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup을 설치하지 못했다." }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe를 찾지 못했다." }
          Write-Host "Inno Setup: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 설치 파일 만들기
        working-directory: ${{ github.workspace }}
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          & $env:ISCC "/DAppVersion=$env:APP_VERSION" "installer\gagyebu.iss"
          if ($LASTEXITCODE -ne 0) { throw "설치 파일을 만들지 못했다." }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: app/build/installer/gagyebu-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub Releases에 올리기
    needs: [prepare, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # 다시 돌렸을 때(릴리스가 이미 있을 때)는 파일만 바꿔 올린다.
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          tag="$TAG"
          ls -l dist
          files="dist/gagyebu-android-arm64.apk dist/gagyebu-setup.exe"
          # 태그로 시작했으면 그 태그가 있는지 확인하고, 손으로 돌렸으면 빌드한 커밋에 태그를 만든다.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            at="--target $GITHUB_SHA"
          else
            at="--verify-tag"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" $files --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$tag" $files --repo "$GITHUB_REPOSITORY" --title "가계부 $tag" --generate-notes $at --prerelease
          else
            gh release create "$tag" $files --repo "$GITHUB_REPOSITORY" --title "가계부 $tag" --generate-notes $at
          fi

  # 릴리스가 올라간 뒤에만 고친다. 먼저 고치면 앱이 아직 없는 파일의 주소를 안내하게 된다.
  catalog:
    name: version.json 고치기
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: catalog/version.json을 이 태그로 고쳐 main에 커밋
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          tag="$TAG_NAME"

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # 손으로 돌렸다. 안내 글은 돌릴 때 적은 한 줄이다.
            notes="$NOTES_INPUT"
          else
            # notes는 주석 달린 태그(git tag -a)의 첫 줄에서 가져온다. 주석이 없는 태그면 비운다.
            git fetch --depth=1 --force --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
            notes=""
            if [ "$(git cat-file -t "refs/tags/$tag")" = tag ]; then
              notes=$(git for-each-ref --format='%(contents:subject)' "refs/tags/$tag")
            fi
          fi

          TAG="$tag" NOTES="$notes" python3 - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path('catalog/version.json')
          version = os.environ['VERSION']
          tag = os.environ['TAG']
          base = '{}/{}/releases/download/{}'.format(
              os.environ['GITHUB_SERVER_URL'], os.environ['GITHUB_REPOSITORY'], tag)

          def key(text):
              # '1.2.3' → (1, 2, 3). 읽지 못하는 값은 가장 낮은 버전으로 본다.
              try:
                  return tuple(int(part) for part in text.split('-')[0].split('.'))
              except (AttributeError, ValueError):
                  return ()

          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          current = data.get('latest')
          if key(current) > key(version):
              # 예전 버전의 수정판을 나중에 올린 경우다. 최신 안내를 뒤로 돌리지 않는다.
              print('지금의 latest({})가 {}보다 높아 그대로 둡니다.'.format(current, version))
              raise SystemExit(0)

          data['latest'] = version
          data.setdefault('min', version)
          data['notes'] = os.environ['NOTES']
          data['android'] = base + '/gagyebu-android-arm64.apk'
          data['windows'] = base + '/gagyebu-setup.exe'
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add catalog/version.json
          if git diff --cached --quiet; then
            echo "바꿀 것이 없습니다."
            exit 0
          fi
          cat catalog/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "카탈로그: 최신 버전을 $VERSION(으)로 올린다"

          # 그사이 main이 움직였으면 그 위에 다시 얹어 올린다.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "::error title=version.json을 main에 올리지 못했다::main에 직접 푸시할 수 없게 막혀 있으면 catalog/version.json을 손으로 고친다."
          exit 1
