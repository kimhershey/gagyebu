name: CI

# 시험, 서버 SQL 검증, 세 플랫폼 빌드.
# main에 올라간 웹 빌드는 GitHub Pages로 배포한다. 저장소에서 한 번 켜 두어야 한다:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
# 꺼져 있으면 배포만 건너뛰고 알려 준다. 배포를 멈추려면 저장소 변수 DEPLOY_PAGES를 'false'로 둔다.

# 어느 브랜치든 푸시하면 돈다. 같은 저장소에서 연 PR은 그 브랜치의 푸시에서 이미 돌았으므로
# pull_request는 걸지 않는다(같은 커밋을 두 번 빌드하지 않는다). 포크에서 PR을 받게 되면 그때 더한다.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  # 서버(Supabase) 주소와 공개 키. 앱에 그대로 들어가는 공개 값이다(데이터는 서버의 행 단위 보안
  # 정책이 지킨다). 다른 프로젝트에 붙이려면 저장소 변수 SUPABASE_URL · SUPABASE_PUBLISHABLE_KEY로
  # 덮어쓴다. service_role 키와 DB 비밀번호는 여기에도, 저장소 어디에도 넣지 않는다.
  SERVER_DEFINES: >-
    --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://trygkkxqeqbtwxqmclyx.supabase.co' }}
    --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_I2hsFvk7-xz0B0oO2SKXlQ_aXvVwkZd' }}

jobs:
  test:
    name: 분석 · 시험 · 라이선스
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Linux에서는 시스템의 SQLite를 쓴다(pubspec.yaml의 hooks 설정).
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: 생성 코드가 최신인지 확인
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - name: 의존성 라이선스 검사
        run: dart run tool/check_licenses.dart

  server-sql:
    name: 서버 SQL (PostgreSQL)
    # 시험은 PostgreSQL 16에서 검증했다. ubuntu-latest(26.04)의 저장소에는 16이 없어
    # 16을 싣고 있는 24.04 러너를 쓴다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: supabase/tests/run_local.sh

  web:
    name: 웹 빌드
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: sqlite3.wasm과 drift_worker.js 준비
        run: dart run tool/prepare_web_assets.dart
      # 엔진 파일을 CDN에서 받지 않고 앱과 함께 올린다. 앱이 다른 서버에 접속하지 않게 하기 위해서다.
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" ${{ env.SERVER_DEFINES }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  # Pages가 'GitHub Actions' 소스로 켜져 있는지 본다. 꺼져 있을 때 배포 작업이 실패하는 대신
  # 무엇을 바꾸면 되는지 알려 주고 건너뛰게 하려는 것이다.
  pages-check:
    name: 웹 배포 준비 확인
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_PAGES: ${{ vars.DEPLOY_PAGES }}
        run: |
          status=$(curl -sS -o pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          build_type=$(jq -r '.build_type // ""' pages.json 2>/dev/null || true)
          echo "Pages API: HTTP $status, build_type=${build_type:-없음}"

          case "$status/$build_type" in
            200/workflow) ready=true ;;
            200/*) ready=false; why="Pages의 Source가 'Deploy from a branch'로 되어 있다." ;;
            404/*) ready=false; why="GitHub Pages가 꺼져 있다." ;;
            *) echo "::error title=Pages 상태를 읽지 못했다::HTTP $status"; cat pages.json; exit 1 ;;
          esac
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

          # 배포할 차례(main)인데 준비가 안 됐으면 눈에 띄게 알린다.
          if [ "$ready" = false ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$DEPLOY_PAGES" != false ]; then
            echo "::warning title=웹 배포를 건너뛰었다::$why 저장소 Settings → Pages → Build and deployment → Source를 'GitHub Actions'로 바꾸면 main의 다음 실행부터 배포된다."
          fi

  deploy-web:
    name: 웹 배포 (GitHub Pages)
    needs: [web, pages-check]
    if: >-
      github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES != 'false'
      && needs.pages-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 저장소 비밀값에 서명 키가 있으면 파일로 풀어 그 경로를 Gradle에 알린다(app/android/app/build.gradle.kts).
      # 없으면(포크, 비밀값을 넣지 않은 저장소) 건너뛰고 디버그 키로 서명한 시험용 APK를 만든다.
      # secrets는 if:에서 읽을 수 없어 env로 받아 셸에서 비었는지 본다.
      - name: 서명 키 준비
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "서명 키(ANDROID_KEYSTORE_BASE64)가 없어 디버그 키로 서명합니다."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "저장소의 서명 키로 서명합니다."
      # 비밀번호는 이 단계에만 준다. 키 파일 경로가 없으면 Gradle은 이 값들을 읽지 않는다.
      - run: flutter build apk --release --target-platform android-arm64 ${{ env.SERVER_DEFINES }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: gagyebu-android-arm64
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release ${{ env.SERVER_DEFINES }}
      # 설치 프로그램(Inno Setup)은 패키징 단계에서 붙인다. 지금은 실행 폴더를 그대로 올린다.
      - uses: actions/upload-artifact@v4
        with:
          name: gagyebu-windows-x64
          path: app/build/windows/x64/runner/Release
